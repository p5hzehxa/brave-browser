name: Autoclose audit issues
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  autoclose:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          set -eEo pipefail
          shopt -s inherit_errexit

          # Assign before looping: a failure of the listing in a process
          # substitution would leave the loop with no input and the job green.
          issues="$(gh issue list \
              -R "${GITHUB_REPOSITORY:?}" \
              -l bot/type/audit \
              -S sort:updated-asc \
              --json number,createdAt,comments \
              -q '.[]|"\(.number)\t\((.comments|sort_by(.createdAt)|.[-1].createdAt) // .createdAt)"')"

          failed=()

          while read -r number last_active; do
              [[ -n $number ]] || continue
              if (( ($(date +%s) - $(date -d "${last_active:?}" +%s)) / 86400 > 30 )); then
                  sleep 5
                  if ! gh issue close -R "$GITHUB_REPOSITORY" "${number:?}" -c "Autoclosing due to inactivity"; then
                      echo "::error::Failed to close issue #${number}"
                      failed+=("$number")
                  fi
              fi
          done <<<"$issues"

          if (( ${#failed[@]} )); then
              echo "Failed to close ${#failed[@]} issue(s): ${failed[*]}" >&2
              exit 1
          fi
