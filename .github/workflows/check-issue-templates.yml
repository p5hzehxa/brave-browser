name: Check issue templates

on:
  pull_request:
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/check-issue-templates.yml
      - scripts/generate_issue_templates.py

permissions:
  contents: read

jobs:
  check:
    name: Check issue forms are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: python3 scripts/generate_issue_templates.py --check
